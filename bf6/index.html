<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BF6 Live Stats Dashboard - Jordan Moddes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        #logo {
            width: 150px;
            height: auto;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 2.5em;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .subtitle {
            font-size: 1.2em;
            color: #888;
            margin-top: 5px;
        }
        .search-container {
            margin-bottom: 30px;
            text-align: center;
        }
        #playerInput {
            padding: 12px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 5px;
            background-color: #1a1a1a;
            color: #fff;
            width: 300px;
        }
        #platformSelect {
            padding: 12px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 5px;
            background-color: #1a1a1a;
            color: #fff;
            margin-left: 10px;
        }
        button {
            padding: 12px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        #loading {
            display: none;
            color: #4CAF50;
            font-style: italic;
        }
        #error {
            display: none;
            color: #ff4444;
            background-color: #330000;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            width: 100%;
        }
        .stat-card {
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #4CAF50;
            margin: 10px 0;
        }
        .stat-label {
            color: #888;
            text-transform: uppercase;
            font-size: 0.9em;
            letter-spacing: 1px;
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 15px;
            border: 2px solid #4CAF50;
        }
        .player-info {
            text-align: center;
            margin-bottom: 20px;
        }
        .footer {
            margin-top: 40px;
            text-align: center;
            color: #666;
            font-size: 0.9em;
        }
        @media (max-width: 600px) {
            #playerInput, #platformSelect {
                width: 100%;
                margin-bottom: 10px;
            }
            button {
                width: 100%;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <header>
        <!-- Placeholder for your logo; replace src with your actual logo URL -->
        <img id="logo" src="https://via.placeholder.com/150x50?text=Jordan+Moddes+Logo" alt="Jordan Moddes Logo">
        <h1>BF6 Live Stats Dashboard</h1>
        <p class="subtitle">Powered by GameTools BF6 API (FREE & Instant) - Jordan Moddes</p>
    </header>

    <div class="search-container">
        <input type="text" id="playerInput" placeholder="Enter BF6 Player Name (e.g., YourUsername)" required>
        <select id="platformSelect">
            <option value="pc">PC</option>
            <option value="psn">PlayStation</option>
            <option value="xbl">Xbox</option>
        </select>
        <button onclick="fetchStats()">Get Live Stats</button>
        <div id="loading">Loading stats... (This is instant!)</div>
    </div>

    <div id="error"></div>

    <div id="playerStats" style="display: none;">
        <div class="player-info">
            <img id="avatar" class="avatar" src="" alt="Player Avatar">
            <h2 id="playerName"></h2>
            <p id="playerLevel"></p>
        </div>
        <div class="stats-grid" id="statsGrid">
            <!-- Stats will be populated here dynamically -->
        </div>
    </div>

    <div class="footer">
        <p>Built by Jordan Moddes | Data from <a href="https://api.gametools.network/docs" style="color: #4CAF50;">GameTools BF6 API</a> | Updated Nov 20, 2025</p>
    </div>

    <script>
        async function fetchStats() {
            const playerName = document.getElementById('playerInput').value.trim();
            const platform = document.getElementById('platformSelect').value;
            if (!playerName) {
                showError('Please enter a player name.');
                return;
            }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('playerStats').style.display = 'none';

            try {
                // GameTools API endpoint for BF6 player stats
                // Note: GameTools uses a search endpoint first to get the personaId, then fetches details.
                // For simplicity, assuming direct stats fetch; adjust if needed based on exact docs.
                // Replace with exact endpoint from https://api.gametools.network/docs#/bf6 (e.g., /bf6/players)
                const response = await fetch(`https://api.gametools.network/bf6/players?platform=${platform}&name=${encodeURIComponent(playerName)}`);
                
                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const data = await response.json();
                
                // Handle if it's a search result array; take first match
                const playerData = Array.isArray(data) ? data[0] : data;
                
                if (!playerData || playerData.error) {
                    throw new Error(playerData?.message || 'Player not found. Check name/platform.');
                }

                // Populate player info (adapt fields to actual API response)
                document.getElementById('playerName').textContent = playerData.username || playerName;
                document.getElementById('playerLevel').textContent = `Level ${playerData.level || 'N/A'} | Rank: ${playerData.rank || 'N/A'}`;
                document.getElementById('avatar').src = playerData.avatar || `https://via.placeholder.com/80?text=${playerName.charAt(0)}`;

                // Populate stats grid (key stats; expand as needed)
                const stats = [
                    { label: 'Total Kills', value: playerData.kills || 0 },
                    { label: 'Total Deaths', value: playerData.deaths || 0 },
                    { label: 'K/D Ratio', value: (playerData.kills / (playerData.deaths || 1)).toFixed(2) },
                    { label: 'Wins', value: playerData.wins || 0 },
                    { label: 'Time Played (hrs)', value: (playerData.timePlayed / 3600).toFixed(1) || 0 },
                    { label: 'Score per Minute', value: playerData.scorePerMinute?.toFixed(1) || 0 }
                ];

                const grid = document.getElementById('statsGrid');
                grid.innerHTML = stats.map(stat => `
                    <div class="stat-card">
                        <div class="stat-value">${stat.value}</div>
                        <div class="stat-label">${stat.label}</div>
                    </div>
                `).join('');

                document.getElementById('playerStats').style.display = 'block';
            } catch (error) {
                showError(error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = `Error: ${message} (Try different platform or exact name.)`;
            errorDiv.style.display = 'block';
        }

        // Allow Enter key to trigger search
        document.getElementById('playerInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                fetchStats();
            }
        });

        // Optional: Auto-fetch example player on load (uncomment if desired)
        // window.onload = () => { document.getElementById('playerInput').value = 'ExamplePlayer'; fetchStats(); };
    </script>
</body>
</html>
