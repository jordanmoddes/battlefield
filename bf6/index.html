<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BF6 Live Stats Dashboard - Jordan Moddes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            color: #ffffff;

            /* Your signature backgrounds */
            background: #0a0a0a 
                        url("https://raw.githubusercontent.com/jordanmoddes/jordanmoddes.github.io/main/assets/Signature_BlackTP.png") 
                        center/38% auto no-repeat fixed;

            /* Light mode override (if user prefers light) */
            @media (prefers-color-scheme: light) {
                background: #ffffff 
                            url("https://raw.githubusercontent.com/jordanmoddes/jordanmoddes.github.io/main/assets/Signature_WhiteTP.png") 
                            center/38% auto no-repeat fixed;
                color: #000000;
            }
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }
        #logo {
            width: 180px;
            height: auto;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 2.8em;
            margin: 10px 0;
            text-shadow: 0 0 20px rgba(0,0,0,0.7);
        }
        .subtitle {
            font-size: 1.3em;
            color: #00ff9d;
            margin-top: 5px;
            font-weight: bold;
        }
        .search-container {
            margin-bottom: 40px;
            text-align: center;
        }
        #playerInput, #platformSelect {
            padding: 14px;
            font-size: 18px;
            border: 2px solid #333;
            border-radius: 8px;
            background-color: rgba(30,30,30,0.9);
            color: #fff;
        }
        #platformSelect {
            margin-left: 12px;
        }
        button {
            padding: 14px 28px;
            font-size: 18px;
            background: linear-gradient(135deg, #00ff9d, #00b86e);
            color: black;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-left: 12px;
            transition: all 0.3s;
        }
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,255,157,0.4);
        }
        #loading {
            display: none;
            color: #00ff9d;
            font-size: 1.2em;
            margin-top: 15px;
        }
        #error {
            display: none;
            color: #ff3366;
            background: rgba(255,0,0,0.1);
            padding: 15px;
            border-radius: 10px;
            max-width: 600px;
            margin: 20px auto;
            text-align: center;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 22px;
            max-width: 1300px;
            margin: 0 auto;
        }
        .stat-card {
            background: rgba(20,20,20,0.85);
            backdrop-filter: blur(10px);
            border: 1px solid #333;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            transition: transform 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-8px);
        }
        .stat-value {
            font-size: 2.6em;
            font-weight: bold;
            color: #00ff9d;
            margin: 12px 0;
        }
        .stat-label {
            color: #888;
            text-transform: uppercase;
            font-size: 0.9em;
            letter-spacing: 1.5px;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid #00ff9d;
            box-shadow: 0 0 20px rgba(0,255,157,0.6);
        }
        .player-info {
            text-align: center;
            margin-bottom: 30px;
        }
        .footer {
            margin-top: 80px;
            text-align: center;
            color: #666;
            font-size: 0.9em;
        }
        @media (max-width: 768px) {
            #playerInput, #platformSelect, button {
                width: 100%;
                margin: 8px 0;
            }
        }
    </style>
</head>
<body>

    <header>
        <img id="logo" src="https://raw.githubusercontent.com/jordanmoddes/jordanmoddes.github.io/main/assets/logo.png" alt="Jordan Moddes Logo">
        <h1>BF6 LIVE STATS</h1>
        <p class="subtitle">Instant • Free • Powered by GameTools API — Jordan Moddes</p>
    </header>

    <div class="search-container">
        <input type="text" id="playerInput" placeholder="Enter BF6 Player Name (exact!)" required>
        <select id="platformSelect">
            <option value="pc">PC (Origin/Steam)</option>
            <option value="psn">PlayStation</option>
            <option value="xbl">Xbox</option>
        </select>
        <button onclick="fetchStats()">GET STATS</button>
        <div id="loading">Fetching live BF6 stats...</div>
    </div>

    <div id="error"></div>

    <div id="playerStats" style="display: none;">
        <div class="player-info">
            <img id="avatar" class="avatar" src="" alt="Avatar">
            <h2 id="playerName"></h2>
            <p id="playerLevel"></p>
        </div>

        <div class="stats-grid" id="statsGrid"></div>
    </div>

    <div class="footer">
        <p>Built & Maintained by <strong>Jordan Moddes</strong> • Data via <a href="https://api.gametools.network" style="color:#00ff9d">GameTools BF6 API</a> • Nov 20, 2025</p>
    </div>

    <script>
        async function fetchStats() {
            const playerName = document.getElementById('playerInput').value.trim();
            const platform = document.getElementById('platformSelect').value;
            if (!playerName) return showError('Enter an exact player name!');

            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('playerStats').style.display = 'none';

            try {
                // Fixed: Use actual GameTools BF6 endpoint pattern (search first, then stats)
                // Based on docs/GitHub: /bf6/player/{platform}/{name} or search variant
                let response = await fetch(`https://api.gametools.network/bf6/player/${platform}/${encodeURIComponent(playerName)}`);
                
                if (!response.ok && response.status === 404) {
                    // Fallback: Try search endpoint if direct fails
                    response = await fetch(`https://api.gametools.network/bf6/players/search?platform=${platform}&q=${encodeURIComponent(playerName)}`);
                }
                
                if (!response.ok) throw new Error(`API Error ${response.status} - Try exact name/platform (e.g., 'shroud' on PC)`);
                
                const data = await response.json();
                const player = Array.isArray(data) ? data[0] : data;
                
                if (!player || player.error) throw new Error('Player not found or inactive (suspended?). Try a live BF6 player.');

                // Map to actual API fields (adapt from docs: e.g., playerName, rank, killsTotal, etc.)
                document.getElementById('playerName').textContent = player.playerName || player.userName || playerName;
                document.getElementById('playerLevel').textContent = `Rank ${player.rank || '-'} • Level ${player.level || '-'}`;
                document.getElementById('avatar').src = player.avatarUrl || `https://via.placeholder.com/100?text=${playerName.charAt(0)}`;

                const stats = [
                    { label: 'Kills', value: player.killsTotal?.toLocaleString() || 0 },
                    { label: 'Deaths', value: player.deathsTotal?.toLocaleString() || 0 },
                    { label: 'K/D Ratio', value: player.kdRatio?.toFixed(2) || (player.killsTotal / (player.deathsTotal || 1)).toFixed(2) },
                    { label: 'Wins', value: player.wins?.toLocaleString() || 0 },
                    { label: 'Win %', value: player.winPercentage ? player.winPercentage.toFixed(1) + '%' : '0%' },
                    { label: 'Time Played', value: player.timePlayed ? (player.timePlayed / 3600).toFixed(0) + 'h' : '0h' },
                    { label: 'SPM', value: player.scorePerMinute?.toFixed(0) || 0 },
                    { label: 'Skill', value: player.skillValue?.toLocaleString() || 0 }
                ];

                document.getElementById('statsGrid').innerHTML = stats.map(s => `
                    <div class="stat-card">
                        <div class="stat-value">${s.value}</div>
                        <div class="stat-label">${s.label}</div>
                    </div>
                `).join('');

                document.getElementById('playerStats').style.display = 'block';

            } catch (err) {
                showError(err.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function showError(msg) {
            document.getElementById('error').textContent = msg;
            document.getElementById('error').style.display = 'block';
        }

        document.getElementById('playerInput').addEventListener('keypress', e => e.key === 'Enter' && fetchStats());
    </script>
</body>
</html>
