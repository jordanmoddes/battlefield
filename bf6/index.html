<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BF6 Live Stats Dashboard - Jordan Moddes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            color: #ffffff;
            background: #0a0a0a url("https://raw.githubusercontent.com/jordanmoddes/jordanmoddes.github.io/main/assets/Signature_BlackTP.png") center/38% auto no-repeat fixed;
        }
        @media (prefers-color-scheme: light) {
            body {
                background: #ffffff url("https://raw.githubusercontent.com/jordanmoddes/jordanmoddes.github.io/main/assets/Signature_WhiteTP.png") center/38% auto no-repeat fixed;
                color: #000000;
            }
        }
        header { text-align: center; margin-bottom: 30px; }
        #logo { width: 180px; height: auto; margin-bottom: 10px; }
        h1 { font-size: 2.8em; margin: 10px 0; text-shadow: 0 0 20px rgba(0,0,0,0.7); }
        .subtitle { font-size: 1.3em; color: #00ff9d; margin-top: 5px; font-weight: bold; }
        .search-container { margin-bottom: 40px; text-align: center; }
        #playerInput, #platformSelect { padding: 14px; font-size: 18px; border: 2px solid #333; border-radius: 8px; background: rgba(30,30,30,0.9); color: #fff; }
        #platformSelect { margin-left: 12px; }
        button { padding: 14px 28px; font-size: 18px; background: linear-gradient(135deg, #00ff9d, #00b86e); color: black; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-left: 12px; transition: all .3s; }
        button:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,255,157,0.4); }
        #loading { display: none; color: #00ff9d; font-size: 1.2em; margin-top: 15px; }
        #error { display: none; color: #ff3366; background: rgba(255,0,0,0.1); padding: 15px; border-radius: 10px; max-width: 600px; margin: 20px auto; text-align: center; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 22px; max-width: 1300px; margin: 0 auto; }
        .stat-card { background: rgba(20,20,20,0.85); backdrop-filter: blur(10px); border: 1px solid #333; border-radius: 15px; padding: 25px; text-align: center; transition: transform .3s; }
        .stat-card:hover { transform: translateY(-8px); }
        .stat-value { font-size: 2.6em; font-weight: bold; color: #00ff9d; margin: 12px 0; }
        .stat-label { color: #888; text-transform: uppercase; font-size: 0.9em; letter-spacing: 1.5px; }
        .avatar { width: 100px; height: 100px; border-radius: 50%; border: 4px solid #00ff9d; box-shadow: 0 0 20px rgba(0,255,157,0.6); }
        .player-info { text-align: center; margin-bottom: 30px; }
        .footer { margin-top: 80px; text-align: center; color: #666; font-size: 0.9em; }
        @media (max-width: 768px) { #playerInput, #platformSelect, button { width: 100%; margin: 8px 0; } }
    </style>
</head>
<body>
    <header>
        <img id="logo" src="https://raw.githubusercontent.com/jordanmoddes/jordanmoddes.github.io/main/assets/logo.png" alt="Jordan Moddes Logo">
        <h1>BF6 LIVE STATS</h1>
        <p class="subtitle">Instant • Free • Powered by GameTools API — Jordan Moddes</p>
    </header>

    <div class="search-container">
        <input type="text" id="playerInput" placeholder="Enter BF6 Player Name (e.g., shroud)" value="shroud">
        <select id="platformSelect">
            <option value="pc">PC</option>
            <option value="psn">PlayStation</option>
            <option value="xbl">Xbox</option>
        </select>
        <button onclick="fetchStats()">GET STATS</button>
        <div id="loading">Fetching live BF6 stats...</div>
    </div>

    <div id="error"></div>

    <div id="playerStats" style="display: none;">
        <div class="player-info">
            <img id="avatar" class="avatar" src="" alt="Avatar">
            <h2 id="playerName"></h2>
            <p id="playerLevel"></p>
        </div>
        <div class="stats-grid" id="statsGrid"></div>
    </div>

    <div class="footer">
        <p>Built & Maintained by <strong>Jordan Moddes</strong> • Data via <a href="https://api.gametools.network/docs" style="color: #00ff9d;">GameTools BF6 API</a> • Nov 20, 2025</p>
    </div>

    <script>
        async function fetchStats() {
            const playerName = document.getElementById('playerInput').value.trim();
            const platform = document.getElementById('platformSelect').value;
            if (!playerName) return showError('Enter a player name!');

            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('playerStats').style.display = 'none';

            try {
                const apiUrl = `https://api.gametools.network/bf2042/stats/?platform=${platform}&name=${encodeURIComponent(playerName)}`;
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(apiUrl)}`;
                const response = await fetch(proxyUrl);
                
                if (!response.ok) throw new Error(`API Error ${response.status}`);

                const player = await response.json();
                
                // Check for empty/no data response (common for private/suspended)
                if (!player || !player.userName || Object.keys(player).length < 5) {
                    throw new Error(`No public stats found for "${playerName}" (private/suspended?). Enable "Share Usage Data" in BF6 settings. Try "shroud" on PC for live example.`);
                }

                document.getElementById('playerName').textContent = player.userName || playerName;
                document.getElementById('playerLevel').textContent = `Rank ${player.rank || 'N/A'} • Level ${player.level || 'N/A'}`;
                document.getElementById('avatar').src = player.avatar || `https://via.placeholder.com/100?text=${playerName.charAt(0)}`;

                const kd = player.kdr || ((player.kills / (player.deaths || 1)) || 0).toFixed(2);
                const winPct = player.winPercent ? player.winPercent.toFixed(1) + '%' : '0%';
                const timeH = player.secondsPlayed ? Math.round(player.secondsPlayed / 3600) + 'h' : '0h';

                const stats = [
                    { label: 'Kills', value: player.kills?.toLocaleString() || '0' },
                    { label: 'Deaths', value: player.deaths?.toLocaleString() || '0' },
                    { label: 'K/D Ratio', value: kd },
                    { label: 'Wins', value: player.wins?.toLocaleString() || '0' },
                    { label: 'Win %', value: winPct },
                    { label: 'Time Played', value: timeH },
                    { label: 'SPM', value: player.scorePerMinute?.toFixed(0) || '0' },
                    { label: 'Skill', value: player.skill?.toLocaleString() || '0' }
                ];

                document.getElementById('statsGrid').innerHTML = stats.map(s => `
                    <div class="stat-card">
                        <div class="stat-value">${s.value}</div>
                        <div class="stat-label">${s.label}</div>
                    </div>
                `).join('');

                document.getElementById('playerStats').style.display = 'block';

            } catch (err) {
                showError(err.message);
                // Fallback demo if no live data
                setTimeout(() => showDemoStats(playerName, platform), 1000);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function showDemoStats(name, platform) {
            const demoData = {
                kills: Math.floor(Math.random() * 50000) + 10000,
                deaths: Math.floor(Math.random() * 20000) + 5000,
                wins: Math.floor(Math.random() * 1500) + 500,
                secondsPlayed: Math.floor(Math.random() * 1500) * 3600,
                scorePerMinute: Math.floor(Math.random() * 250) + 100,
                skill: Math.floor(Math.random() * 4000) + 1000,
                rank: Math.floor(Math.random() * 100) + 1,
                level: Math.floor(Math.random() * 200) + 50
            };
            demoData.kdr = (demoData.kills / demoData.deaths).toFixed(2);

            document.getElementById('playerName').textContent = `${name} (${platform.toUpperCase()}) - Demo Mode`;
            document.getElementById('playerLevel').textContent = `Rank ${demoData.rank} • Level ${demoData.level}`;
            document.getElementById('avatar').src = `https://via.placeholder.com/100/333/fff?text=${name.charAt(0)}`;

            const stats = [
                { label: 'Kills', value: demoData.kills.toLocaleString() },
                { label: 'Deaths', value: demoData.deaths.toLocaleString() },
                { label: 'K/D Ratio', value: demoData.kdr },
                { label: 'Wins', value: demoData.wins.toLocaleString() },
                { label: 'Win %', value: '51.2%' },
                { label: 'Time Played', value: `${Math.round(demoData.secondsPlayed / 3600)}h` },
                { label: 'SPM', value: demoData.scorePerMinute },
                { label: 'Skill', value: demoData.skill.toLocaleString() }
            ];

            document.getElementById('statsGrid').innerHTML = stats.map(s => `
                <div class="stat-card">
                    <div class="stat-value">${s.value}</div>
                    <div class="stat-label">${s.label}</div>
                </div>
            `).join('');

            document.getElementById('playerStats').style.display = 'block';
        }

        function showError(msg) {
            document.getElementById('error').textContent = msg;
            document.getElementById('error').style.display = 'block';
        }

        document.getElementById('playerInput').addEventListener('keypress', e => e.key === 'Enter' && fetchStats());

        // Auto-fetch live example on load
        window.onload = () => {
            document.getElementById('playerInput').value = 'shroud';
            document.getElementById('platformSelect').value = 'pc';
            fetchStats();
        };
    </script>
</body>
</html>
