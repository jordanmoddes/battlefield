<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220">
  <title>Jmod's BF6 Stats</title>
  <link rel="icon" type="image/png" href="/assets/Signature_WhiteTP.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    :root {
      --bf-accent:#ff6a00; --bf-accent2:#ff8c00;
      --bg-overlay:rgba(8,14,26,.92);
      --card-bg:rgba(255,255,255,.07); --card-bg-hover:rgba(255,255,255,.11);
      --card-border:rgba(255,255,255,.13); --card-border-hover:rgba(255,106,0,.4);
      --text:#f0f4ff; --sub:#8fa3c0; --title:#60a5fa;
      --nav-bg:rgba(6,10,20,.92);
    }
    body.light {
      --bg-overlay:rgba(225,233,248,.94);
      --card-bg:rgba(0,0,0,.04); --card-bg-hover:rgba(0,0,0,.07);
      --card-border:rgba(15,23,42,.14); --card-border-hover:rgba(255,106,0,.5);
      --text:#0b1220; --sub:#4b5e78; --title:#1d4ed8;
      --nav-bg:rgba(225,233,248,.95);
    }
    *{box-sizing:border-box;}
    body{
      position:relative; min-height:100vh; color:var(--text);
      background:linear-gradient(180deg,var(--bg-overlay),var(--bg-overlay)),
        url("https://assetsio.gnwcdn.com/battlefield-6-2.jpg?width=690&quality=85&format=jpg&dpr=3&auto=webp")
        center/cover no-repeat fixed;
      font-family:'Barlow',system-ui,sans-serif;
      transition:background-color .25s,color .25s;
    }
    .jm-watermark{
      position:fixed;inset:0;
      background:url("/assets/Signature_BlackTP.png") center/38% auto no-repeat;
      opacity:.04;pointer-events:none;z-index:0;
    }
    .page-shell{position:relative;z-index:1;}

    /* â”€â”€ NAV â”€â”€ */
    .nav{
      backdrop-filter:blur(14px);
      background:var(--nav-bg);
      border-bottom:1px solid var(--card-border);
      position:sticky;top:0;z-index:50;
    }
    .nav-inner{
      max-width:1152px;margin:0 auto;
      padding:.6rem 1rem;
      display:flex;align-items:center;gap:.5rem;
      flex-wrap:nowrap;
    }
    .brand{
      font-family:'Bebas Neue',sans-serif;font-size:1.4rem;
      letter-spacing:.12em;color:var(--bf-accent);
      text-decoration:none;flex-shrink:0;margin-right:.25rem;
    }
    /* auto toggle */
    .toggle-wrap{display:flex;align-items:center;gap:.3rem;cursor:pointer;flex-shrink:0;}
    .toggle-track{
      width:28px;height:15px;background:var(--card-border);
      border-radius:99px;position:relative;transition:background .2s;flex-shrink:0;
    }
    .toggle-track.on{background:var(--bf-accent);}
    .toggle-thumb{
      width:11px;height:11px;background:#fff;border-radius:50%;
      position:absolute;top:2px;left:2px;transition:transform .2s;
    }
    .toggle-track.on .toggle-thumb{transform:translateX(13px);}
    .toggle-label{
      font-family:'Barlow Condensed',sans-serif;
      font-weight:700;font-size:.68rem;letter-spacing:.1em;
      text-transform:uppercase;color:var(--sub);
      white-space:nowrap;
    }
    .refresh-timer{
      font-family:'Barlow Condensed',sans-serif;
      font-size:.68rem;letter-spacing:.04em;color:var(--sub);
      white-space:nowrap;flex-shrink:0;min-width:44px;
    }
    /* nav right group */
    .nav-actions{display:flex;align-items:center;gap:.4rem;margin-left:auto;flex-shrink:0;}
    .icon-btn{
      background:var(--card-bg);border:1px solid var(--card-border);
      padding:.38rem .7rem;border-radius:.45rem;
      font-family:'Barlow Condensed',sans-serif;font-weight:700;
      font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;
      color:var(--text);cursor:pointer;transition:all .15s;white-space:nowrap;
    }
    .icon-btn:hover{border-color:var(--bf-accent);color:var(--bf-accent);}
    /* hide labels on very small screens, keep icons */
    @media(max-width:420px){
      .icon-btn-label{display:none;}
      .icon-btn{padding:.38rem .5rem;}
    }

    /* â”€â”€ CARDS â”€â”€ */
    .card{
      background:var(--card-bg);border:1px solid var(--card-border);
      border-radius:12px;padding:16px;transition:border-color .2s,background .2s;
    }
    .card:hover{border-color:var(--card-border-hover);}
    .card-tight{padding:12px 14px;}

    /* â”€â”€ SECTION TITLE â”€â”€ */
    .sect-title{
      font-family:'Barlow Condensed',sans-serif;font-weight:900;
      font-size:.7rem;text-transform:uppercase;letter-spacing:.18em;
      color:var(--bf-accent);margin-bottom:.75rem;
      display:flex;align-items:center;gap:.5rem;
    }
    .sect-title::after{
      content:'';flex:1;height:1px;
      background:linear-gradient(90deg,var(--card-border),transparent);
    }

    /* â”€â”€ STAT ATOMS â”€â”€ */
    .stat-label{
      font-family:'Barlow Condensed',sans-serif;font-size:.67rem;
      text-transform:uppercase;letter-spacing:.1em;color:var(--sub);
    }
    .stat-value{
      font-family:'Barlow Condensed',sans-serif;font-weight:700;
      font-size:1.12rem;line-height:1.1;
    }
    .stat-sub{font-size:.67rem;color:var(--sub);margin-top:.1rem;}
    .grid-auto{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(155px,1fr));
      gap:10px;
    }

    /* â”€â”€ FORM ELEMENTS â”€â”€ */
    .radio{
      appearance:none;width:17px;height:17px;
      border:2px solid var(--card-border);border-radius:50%;
      position:relative;cursor:pointer;transition:border-color .15s;flex-shrink:0;
    }
    .radio:checked{border-color:var(--bf-accent);}
    .radio:checked::after{
      content:'';position:absolute;inset:3px;
      border-radius:50%;background:var(--bf-accent);
    }
    .chip{
      background:var(--card-bg);border:1px solid var(--card-border);
      padding:.32rem .6rem;border-radius:.45rem;
      font-family:'Barlow Condensed',sans-serif;font-weight:600;
      font-size:.76rem;letter-spacing:.04em;cursor:pointer;transition:border-color .15s;
      display:flex;align-items:center;gap:.4rem;
    }
    .chip:has(.radio:checked){border-color:var(--bf-accent);}
    #tag{
      background:var(--card-bg);border:1px solid var(--card-border);
      color:var(--text);border-radius:6px;padding:.55rem .7rem;
      font-family:'Barlow Condensed',sans-serif;font-size:.95rem;
      font-weight:600;letter-spacing:.04em;outline:none;transition:border-color .15s;
      width:100%;
    }
    #tag:focus{border-color:var(--bf-accent);}
    .btn-load{
      background:var(--bf-accent);color:#0b0f1a;
      font-family:'Bebas Neue',sans-serif;font-size:1.05rem;
      letter-spacing:.1em;padding:.6rem 1.4rem;
      border-radius:6px;border:none;cursor:pointer;
      transition:opacity .15s,transform .1s;white-space:nowrap;
    }
    .btn-load:hover{opacity:.88;transform:translateY(-1px);}
    .btn-load:active{transform:translateY(0);}

    /* â”€â”€ RANK HERO â”€â”€ */
    .rank-icon-wrap{
      position:relative;width:100px;height:100px;
      display:flex;align-items:center;justify-content:center;
    }
    .rank-icon-wrap::before{
      content:'';position:absolute;inset:-10px;border-radius:50%;
      background:radial-gradient(circle,rgba(255,106,0,.22) 0%,transparent 70%);
      animation:rankPulse 3s ease-in-out infinite;
    }
    @keyframes rankPulse{0%,100%{opacity:.5;transform:scale(1);}50%{opacity:1;transform:scale(1.1);}}
    .rank-icon{
      width:90px;height:90px;object-fit:contain;
      filter:drop-shadow(0 4px 16px rgba(255,106,0,.5));
      position:relative;z-index:1;
      animation:rankFloat 4s ease-in-out infinite;
    }
    @keyframes rankFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}

    /* â”€â”€ XP BAR â”€â”€ */
    .xp-bar-track{
      height:4px;background:var(--card-border);
      border-radius:99px;overflow:hidden;margin-top:.2rem;
    }
    .xp-bar-fill{
      height:100%;
      background:linear-gradient(90deg,var(--bf-accent),var(--bf-accent2));
      border-radius:99px;transition:width 1.2s cubic-bezier(.4,0,.2,1);width:0;
    }

    /* â”€â”€ WIN BAR â”€â”€ */
    .win-bar{height:5px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.08);}
    .win-bar-fill{
      height:100%;background:linear-gradient(90deg,#22c55e,#16a34a);
      border-radius:99px;transition:width 1s ease;width:0;
    }

    /* â”€â”€ IN-MATCH BADGE â”€â”€ */
    .in-match-badge{
      display:inline-flex;align-items:center;gap:.28rem;
      background:rgba(255,40,40,.14);border:1px solid rgba(255,40,40,.4);
      color:#ff6060;font-family:'Barlow Condensed',sans-serif;
      font-weight:700;font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;
      padding:.18rem .5rem;border-radius:4px;
    }
    .in-match-badge .dot{
      width:5px;height:5px;border-radius:50%;background:#ff4040;
      animation:liveDot 1.2s ease-in-out infinite;flex-shrink:0;
    }
    @keyframes liveDot{0%,100%{opacity:1;}50%{opacity:.15;}}

    /* â”€â”€ KD GAUGE â”€â”€ */
    .kd-arc{width:76px;height:42px;position:relative;overflow:visible;}
    .kd-arc svg{width:100%;height:100%;overflow:visible;}

    /* â”€â”€ CLASS BAR â”€â”€ */
    .class-bars{display:flex;gap:2px;height:7px;border-radius:4px;overflow:hidden;}
    .class-bar-seg{height:100%;transition:width 1s ease;min-width:0;}

    /* â”€â”€ DELTA / PB â”€â”€ */
    .delta-up{color:#4ade80;font-size:.62rem;font-weight:700;}
    .delta-down{color:#f87171;font-size:.62rem;font-weight:700;}
    .pb-tag{
      display:inline-block;
      background:rgba(255,106,0,.14);border:1px solid rgba(255,106,0,.32);
      color:var(--bf-accent);font-family:'Barlow Condensed',sans-serif;
      font-size:.58rem;font-weight:700;letter-spacing:.1em;
      padding:.03rem .28rem;border-radius:3px;vertical-align:middle;margin-left:.25rem;
    }
    .platform-dot{
      width:7px;height:7px;border-radius:50%;background:var(--bf-accent);
      display:inline-block;margin-right:3px;
    }

    /* â”€â”€ WEAPON SORT TOGGLE â”€â”€ */
    .sort-toggle{
      display:inline-flex;border:1px solid var(--card-border);
      border-radius:6px;overflow:hidden;margin-bottom:.6rem;
    }
    .sort-btn{
      font-family:'Barlow Condensed',sans-serif;font-weight:700;
      font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;
      padding:.3rem .6rem;cursor:pointer;background:transparent;
      border:none;color:var(--sub);transition:all .15s;
    }
    .sort-btn.active{background:var(--bf-accent);color:#0b0f1a;}

    /* â”€â”€ HERO ITEM â”€â”€ */
    .hero-item{display:flex;gap:10px;align-items:flex-start;}
    .hi-img{
      width:64px;height:48px;object-fit:cover;
      border-radius:7px;border:1px solid var(--card-border);flex-shrink:0;
    }
    .hi-img-sq{
      width:56px;height:56px;object-fit:cover;
      border-radius:7px;border:1px solid var(--card-border);flex-shrink:0;
    }

    /* â”€â”€ SKELETON â”€â”€ */
    .skeleton{
      background:linear-gradient(90deg,var(--card-bg) 25%,var(--card-bg-hover) 50%,var(--card-bg) 75%);
      background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:6px;
    }
    @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

    /* â”€â”€ REVEAL â”€â”€ */
    .reveal{opacity:0;transform:translateY(12px);animation:revealUp .38s ease forwards;}
    @keyframes revealUp{to{opacity:1;transform:translateY(0);}}
    .d1{animation-delay:.04s;}.d2{animation-delay:.09s;}.d3{animation-delay:.14s;}
    .d4{animation-delay:.19s;}.d5{animation-delay:.24s;}.d6{animation-delay:.29s;}
    .d7{animation-delay:.34s;}.d8{animation-delay:.39s;}

    /* â”€â”€ FLAVOR â”€â”€ */
    .flavor-quote{
      font-family:'Bebas Neue',sans-serif;font-size:.88rem;
      letter-spacing:.2em;color:var(--sub);opacity:.55;text-align:center;
    }

    /* â”€â”€ RETRY â”€â”€ */
    .retry-cd{font-family:'Barlow Condensed',sans-serif;font-size:.8rem;color:var(--sub);}

    /* â”€â”€ MASTERY BADGE â”€â”€ */
    .mastery-badge{
      display:inline-block;
      background:rgba(96,165,250,.12);border:1px solid rgba(96,165,250,.28);
      color:#93c5fd;font-family:'Barlow Condensed',sans-serif;
      font-size:.6rem;font-weight:700;letter-spacing:.1em;
      padding:.03rem .3rem;border-radius:3px;vertical-align:middle;margin-left:.25rem;
    }

    /* scrollbar */
    ::-webkit-scrollbar{width:5px;height:5px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:var(--card-border);border-radius:3px;}
    ::-webkit-scrollbar-thumb:hover{background:var(--bf-accent);}
  </style>
</head>

<body class="pb-16">
<div class="jm-watermark"></div>
<div class="page-shell">

  <!-- NAV -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="https://jordanmoddes.com" target="_blank" class="brand">JMOD</a>

      <div class="toggle-wrap" id="autoRefreshToggle" title="Auto-refresh every 5 min">
        <div class="toggle-track" id="toggleTrack"><div class="toggle-thumb"></div></div>
        <span class="toggle-label">Auto</span>
      </div>

      <div class="refresh-timer" id="refreshTimer">&mdash;</div>

      <div class="nav-actions">
        <a class="icon-btn" href="https://gametools.network/stats" target="_blank">
          <span class="icon-btn-label">GameTools</span>
        </a>
        <button id="shareBtn" class="icon-btn" type="button">
          <span class="icon-btn-label">Share</span>
        </button>
        <button id="snipBtn" class="icon-btn" type="button">
          <span class="icon-btn-label">Snip</span>
        </button>
        <button id="themeBtn" class="icon-btn" type="button">
          <span class="icon-btn-label">Light</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- HEADER -->
  <header class="text-center mt-5 mb-5 px-4">
    <h1 class="font-display" style="font-family:'Bebas Neue',sans-serif;font-size:clamp(2rem,6vw,3.2rem);color:var(--bf-accent);letter-spacing:.1em;">
      BF6 STATS
    </h1>
    <p id="flavorQuote" class="flavor-quote mt-1"></p>
    <p class="text-xs mt-1" style="color:var(--sub);font-family:'Barlow Condensed',sans-serif;letter-spacing:.08em;">
      api.gametools.network/bf6 &nbsp;&middot;&nbsp; bf6ranks.com &nbsp;&middot;&nbsp; Real-time
    </p>
  </header>

  <!-- CONTROLS -->
  <form id="controls" class="max-w-6xl mx-auto mb-5 px-4">
    <div class="card grid grid-cols-1 md:grid-cols-[1fr_auto_1fr_auto] gap-3 items-end">
      <div>
        <div class="stat-label mb-2">Platform</div>
        <div class="flex flex-wrap gap-2">
          <label class="chip"><input class="radio" type="radio" name="platform" value="pc" id="pc"><span>PC</span></label>
          <label class="chip"><input class="radio" type="radio" name="platform" value="psn" id="psn" checked><span>PlayStation</span></label>
          <label class="chip"><input class="radio" type="radio" name="platform" value="xboxone" id="xboxone"><span>Xbox</span></label>
        </div>
      </div>
      <div class="flex items-end justify-center">
        <button type="submit" class="btn-load">LOAD STATS</button>
      </div>
      <div>
        <div class="stat-label mb-2">Player Tag</div>
        <input id="tag" value="teamjmod" placeholder="Enter gamertag&hellip;" autocomplete="off">
      </div>
      <div class="flex items-end justify-end">
        <div class="text-right">
          <div class="stat-label">Last Loaded</div>
          <div class="refresh-timer mt-1" id="updated">&mdash;</div>
        </div>
      </div>
    </div>
  </form>

  <!-- SNIP TARGET -->
  <div id="snip-root">
    <div id="content" class="max-w-6xl mx-auto px-4 space-y-4 text-sm"></div>

    <section class="max-w-6xl mx-auto mt-6 px-4">
      <div class="card card-tight text-center">
        <img src="/assets/Signature_BlackTP.png" alt="JM" class="max-w-[130px] w-full opacity-50 mx-auto">
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--sub);">
          Jmod &nbsp;&middot;&nbsp; Battlefield Stats
        </div>
      </div>
    </section>
  </div>

  <!-- RAW JSON -->
  <section class="max-w-6xl mx-auto mt-4 px-4">
    <div class="card card-tight">
      <div class="flex justify-between items-center">
        <div class="sect-title" style="margin-bottom:0">Raw JSON</div>
        <div id="status" class="refresh-timer">Idle</div>
      </div>
      <details>
        <summary class="text-xs cursor-pointer mt-2" style="color:var(--sub)">Show / hide</summary>
        <pre id="json" style="font-family:ui-monospace,monospace;font-size:.7rem;white-space:pre-wrap;max-height:360px;overflow:auto;color:var(--sub);margin-top:.5rem;">No data loaded yet.</pre>
      </details>
    </div>
  </section>

  <footer class="text-center mt-6 pb-4 px-4" style="font-family:'Barlow Condensed',sans-serif;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--sub);opacity:.4;">
    GameTools BF6 API &nbsp;&middot;&nbsp; bf6ranks.com &nbsp;&middot;&nbsp; Built by Jmod
  </footer>
</div>

<script>
/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   CONSTANTS
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
const API_BASE   = "https://api.gametools.network/bf6/stats/";
const SNAP_KEY   = "bf6_prev_stats";
const PB_KEY     = "bf6_pb";

const FLAVOR = [
  "Hold the line.", "Bullets don't lie.", "Stay frosty.",
  "Contact, front.", "Moving up.", "Watch your six.",
  "Push the objective.", "Eyes on.", "Oscar Mike.",
  "On your feet, soldier."
];

const CLASS_COLORS = { Assault:"#f97316", Engineer:"#3b82f6", Support:"#22c55e", Recon:"#a855f7", All:"#8fa3c0" };

let weaponSortMode = "kills"; // "kills" | "mastery"
let lastRenderData = null;
let lastRenderPlatform = null;

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   RANK IMAGE  (bf6ranks.com)
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
function getRankImg(r) {
  r = Math.max(1, Math.floor(Number(r) || 1));
  let t;
  if (r <= 50)        t = r;
  else if (r <= 100)  t = Math.max(55, Math.floor(r/5)*5);
  else if (r <= 500)  t = Math.max(110, Math.floor(r/10)*10);
  else                t = Math.max(1000, Math.min(5000, Math.floor(r/500)*500));
  return `https://bf6ranks.com/ranks/${t}.png`;
}

/* rough XP-to-rank (fallback only) */
function xpToRank(xp) {
  if (!xp) return null;
  const x = Number(xp);
  if (x < 500000)  return Math.max(1, Math.floor(x/10000)+1);
  if (x < 2000000) return Math.floor(50+(x-500000)/20000);
  if (x < 8000000) return Math.floor(125+(x-2000000)/40000);
  return Math.floor(275+(x-8000000)/80000);
}
function xpForRank(r) {
  if (r<=50)  return r*10000;
  if (r<=125) return 500000+(r-50)*20000;
  if (r<=275) return 2000000+(r-125)*40000;
  return 8000000+(r-275)*80000;
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   FORMAT HELPERS
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
const fmtN  = x => (x==null||isNaN(x)) ? "&mdash;" : Number(x).toLocaleString();
const fmtF  = (x,d=2) => (x==null||isNaN(x)) ? "&mdash;" : Number(x).toFixed(d);
const fmtP  = x => x==null ? "&mdash;" : String(x);
const fmtS  = sec => {
  if (!sec&&sec!==0) return "&mdash;";
  const s=Number(sec), h=Math.floor(s/3600), m=Math.floor((s%3600)/60);
  if(!h&&!m) return s+"s";
  return h ? `${h}h&nbsp;${m}m` : `${m}m`;
};
const km    = x => (!x&&x!==0) ? "&mdash;" : (Number(x)/1000).toFixed(1)+" km";
const pctN  = (w,m) => { const mm=Number(m||0); return mm ? (Number(w||0)/mm)*100 : 0; };

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   DELTA + PB
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
const PB = (() => { try { return JSON.parse(localStorage.getItem(PB_KEY)||"{}"); } catch{ return {}; } })();
function savePB(){ localStorage.setItem(PB_KEY,JSON.stringify(PB)); }

function checkPB(key,val){
  const v=Number(val); if(isNaN(v)) return false;
  if(!PB[key]||v>PB[key]){ PB[key]=v; savePB(); return true; }
  return false;
}
function pbTag(key,val){ return checkPB(key,val)?'<span class="pb-tag">PB &#x1F525;</span>':''; }

function getPrev(){ try{ return JSON.parse(localStorage.getItem(SNAP_KEY)||"null"); }catch{ return null; } }
function deltaInt(key,cur,prev){
  if(!prev) return "";
  const d=Number(cur)-Number(prev[key]||0);
  if(!d||isNaN(d)) return "";
  const cls=d>0?"delta-up":"delta-down";
  return `<span class="${cls}">${d>0?"+":""}${Number(d).toLocaleString()}</span>`;
}
function deltaFlt(key,cur,prev,d=2){
  if(!prev) return "";
  const diff=Number(cur)-Number(prev[key]||0);
  if(Math.abs(diff)<0.001||isNaN(diff)) return "";
  const cls=diff>0?"delta-up":"delta-down";
  return `<span class="${cls}">${diff>0?"+":""}${diff.toFixed(d)}</span>`;
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   MAP HELPERS
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
const isRS  = m => String(m?.mapName??"").trim().toUpperCase().includes("REDSEC");
function sumMaps(rows){ return rows.reduce((a,m)=>({
  matches:a.matches+Number(m?.matches||0),
  wins:a.wins+Number(m?.wins||0),
  losses:a.losses+Number(m?.losses||0)
}),{matches:0,wins:0,losses:0}); }
function rsSplit(maps){
  const l=Array.isArray(maps)?maps:[];
  const red=sumMaps(l.filter(isRS)), non=sumMaps(l.filter(m=>!isRS(m)));
  return {
    red:{...red,winPct:pctN(red.wins,red.matches)},
    non:{...non,winPct:pctN(non.wins,non.matches)}
  };
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   KD GAUGE SVG
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
function kdSVG(kd){
  const v=Math.min(Math.max(Number(kd)||0,0),4);
  const pct=v/4, ang=pct*180;
  const r=34,cx=38,cy=38;
  const rad=(ang-180)*Math.PI/180;
  const ex=cx+r*Math.cos(rad), ey=cy+r*Math.sin(rad);
  const lg=ang>180?1:0;
  const col=v>=2?"#4ade80":v>=1?"#facc15":"#f87171";
  return `<svg viewBox="0 0 76 42" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">
    <path d="M ${cx-r},${cy} A ${r},${r} 0 0,1 ${cx+r},${cy}"
      fill="none" stroke="rgba(255,255,255,.09)" stroke-width="5" stroke-linecap="round"/>
    <path d="M ${cx-r},${cy} A ${r},${r} 0 ${lg},1 ${ex},${ey}"
      fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round"
      style="filter:drop-shadow(0 0 4px ${col})"/>
    <text x="${cx}" y="${cy-3}" text-anchor="middle"
      font-family="Barlow Condensed,sans-serif" font-weight="700" font-size="12" fill="${col}">${fmtF(kd,2).replace("&mdash;","â€”")}</text>
    <text x="${cx-r+2}" y="${cy+10}" text-anchor="middle"
      font-family="Barlow Condensed,sans-serif" font-size="6.5" fill="rgba(255,255,255,.3)">0</text>
    <text x="${cx+r-2}" y="${cy+10}" text-anchor="middle"
      font-family="Barlow Condensed,sans-serif" font-size="6.5" fill="rgba(255,255,255,.3)">4</text>
  </svg>`;
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   MASTERY BADGE
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
function masteryBadge(w){
  // field names the API might use
  const m = w?.masteryLevel ?? w?.mastery ?? w?.weaponMastery ?? w?.rank ?? w?.level ?? null;
  if (!m && m!==0) return "";
  return `<span class="mastery-badge">M${m}</span>`;
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   SORT WEAPONS
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
function sortWeapons(list, mode){
  return [...list].sort((a,b)=>{
    if(mode==="mastery"){
      const ma = a?.masteryLevel ?? a?.mastery ?? a?.weaponMastery ?? a?.rank ?? a?.level ?? 0;
      const mb = b?.masteryLevel ?? b?.mastery ?? b?.weaponMastery ?? b?.rank ?? b?.level ?? 0;
      return Number(mb)-Number(ma);
    }
    return (b.kills||0)-(a.kills||0);
  });
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   SKELETON
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   SNIP â€” TILE-BASED GRID
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
async function doSnip(){
  const wasLight=document.body.classList.contains('light');
  if(wasLight) document.body.classList.remove('light');

  // Brief pause to let theme flip paint
  await new Promise(r=>setTimeout(r,60));

  const isMobile=window.innerWidth<768;

  // Section IDs to capture as tiles (in order)
  const tileIds=['snip-hero','snip-spotlight','snip-combat','snip-classes','snip-weapons','snip-vehicles','snip-maps'];
  const SCALE=2;
  const GAP=8*SCALE;
  const PAD=12*SCALE;

  try{
    // Capture each tile
    const tiles=[];
    for(const id of tileIds){
      const el=document.getElementById(id);
      if(!el) continue;
      const c=await html2canvas(el,{
        useCORS:true,
        backgroundColor:null,
        scale:SCALE,
        logging:false,
        scrollX:0,
        scrollY:-window.scrollY,
        windowWidth:document.documentElement.scrollWidth,
        windowHeight:document.documentElement.scrollHeight
      });
      tiles.push(c);
    }

    if(!tiles.length){ alert('Nothing to snip.'); return; }

    let finalCanvas;

    if(!isMobile){
      // â”€â”€ DESKTOP: 2-column grid â”€â”€
      // left col: hero, combat, classes, vehicles
      // right col: spotlight, weapons, maps
      const leftIds  =['snip-hero','snip-combat','snip-classes','snip-vehicles'];
      const rightIds =['snip-spotlight','snip-weapons','snip-maps'];

      const leftTiles  = tileIds.map((id,i)=>leftIds.includes(id)?tiles[i]:null).filter(Boolean);
      const rightTiles = tileIds.map((id,i)=>rightIds.includes(id)?tiles[i]:null).filter(Boolean);

      const leftH  = leftTiles.reduce((a,c)=>a+c.height+GAP,0)-GAP;
      const rightH = rightTiles.reduce((a,c)=>a+c.height+GAP,0)-GAP;
      const colW   = Math.max(...tiles.map(t=>t.width));
      const totalH = Math.max(leftH,rightH)+PAD*2;
      const totalW = colW*2+GAP+PAD*2;

      finalCanvas=document.createElement('canvas');
      finalCanvas.width=totalW; finalCanvas.height=totalH;
      const ctx=finalCanvas.getContext('2d');

      // dark bg
      ctx.fillStyle='#080e1a'; ctx.fillRect(0,0,totalW,totalH);

      let ly=PAD, ry=PAD;
      const lx=PAD, rx=PAD+colW+GAP;

      for(const t of leftTiles){ ctx.drawImage(t,lx,ly); ly+=t.height+GAP; }
      for(const t of rightTiles){ ctx.drawImage(t,rx,ry); ry+=t.height+GAP; }

      // watermark text footer
      ctx.fillStyle='rgba(255,255,255,.18)';
      ctx.font=`bold ${18}px "Barlow Condensed",sans-serif`;
      ctx.textAlign='center';
      ctx.fillText('JMOD  Â·  BF6 STATS',totalW/2,totalH-PAD/2);

    } else {
      // â”€â”€ MOBILE: single column, full width â”€â”€
      // Arrange all tiles vertically, full width â€” clean and readable
      const colW=tiles[0].width;
      const totalH=tiles.reduce((a,t)=>a+t.height+GAP,PAD*2)-GAP;
      const totalW=colW+PAD*2;

      finalCanvas=document.createElement('canvas');
      finalCanvas.width=totalW; finalCanvas.height=totalH;
      const ctx=finalCanvas.getContext('2d');

      ctx.fillStyle='#080e1a'; ctx.fillRect(0,0,totalW,totalH);

      let y=PAD;
      for(const t of tiles){ ctx.drawImage(t,PAD,y); y+=t.height+GAP; }

      ctx.fillStyle='rgba(255,255,255,.18)';
      ctx.font=`bold ${18}px "Barlow Condensed",sans-serif`;
      ctx.textAlign='center';
      ctx.fillText('JMOD  Â·  BF6 STATS',totalW/2,totalH-PAD/2);
    }

    finalCanvas.toBlob(async blob=>{
      if(!blob){ alert('Failed to create image.'); return; }
      try{
        await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
        const t=snipBtn.textContent;
        snipBtn.querySelector('.icon-btn-label').textContent='Snipped!';
        setTimeout(()=>snipBtn.querySelector('.icon-btn-label').textContent='Snip',1400);
      } catch {
        const a=document.createElement('a');
        a.href=URL.createObjectURL(blob);
        a.download=isMobile?'bf6-mobile.png':'bf6-desktop.png';
        a.click();
      }
    },'image/png');

  } catch(err){
    console.error(err);
    alert('Screenshot failed: '+err.message);
  } finally {
    if(wasLight) document.body.classList.add('light');
  }
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   API LOAD
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
let retryTimer=null;

async function loadStats(){
  const platform=document.querySelector("input[name='platform']:checked")?.value||"psn";
  const tag=(tagEl.value||"").trim()||"teamjmod";
  const url=`${API_BASE}?${new URLSearchParams({name:tag,platform,lang:"en-us"})}`;

  if(retryTimer){ clearInterval(retryTimer); retryTimer=null; }
  statusEl.textContent="Loading\u2026";
  renderSkeleton();
  jsonEl.textContent="Fetching\u2026";

  try{
    const res=await fetch(url,{cache:"no-store"});
    const raw=await res.text();
    let data;
    try{ data=JSON.parse(raw); }catch{ data=raw; }
    if(!res.ok||typeof data==="string") throw new Error(typeof data==="string"?data:JSON.stringify(data,null,2));

    jsonEl.textContent=JSON.stringify(data,null,2);
    updatedEl.textContent=new Date().toLocaleTimeString();
    statusEl.textContent="OK";
    lastLoadTime=Date.now();
    startTimer();
    renderDashboard(data,platform);

  }catch(err){
    console.error(err);
    statusEl.textContent="Error";
    jsonEl.textContent="Error:\n\n"+(err.message||String(err));
    let cd=30;
    contentEl.innerHTML=`
      <div class="card text-center reveal d1">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:var(--bf-accent);margin-bottom:.5rem">Load Failed</div>
        <div class="stat-sub mb-2">Could not load <b>${(tagEl.value||"").trim()||"&mdash;"}</b> on ${(document.querySelector("input[name='platform']:checked")?.value||"psn").toUpperCase()}</div>
        <div class="retry-cd" id="rcd">Retrying in ${cd}s&hellip;</div>
      </div>`;
    retryTimer=setInterval(()=>{
      cd--;
      const el=document.getElementById('rcd');
      if(el) el.textContent=`Retrying in ${cd}s\u2026`;
      if(cd<=0){ clearInterval(retryTimer); retryTimer=null; loadStats(); }
    },1000);
  }
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   TIMER + AUTO REFRESH
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
let lastLoadTime=0, timerIv=null, arIv=null, arOn=false;

function startTimer(){
  if(timerIv) clearInterval(timerIv);
  timerIv=setInterval(()=>{
    const s=Math.floor((Date.now()-lastLoadTime)/1000);
    timerEl.textContent=s<60?`${s}s ago`:`${Math.floor(s/60)}m ago`;
  },1000);
}
function setAR(on){
  arOn=on;
  document.getElementById('toggleTrack').classList.toggle('on',on);
  if(arIv) clearInterval(arIv);
  if(on) arIv=setInterval(loadStats,5*60*1000);
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   DOM REFS + INIT
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */

}

// Share â€” syncs platform into URL
shareBtn.addEventListener('click',async()=>{
  const p=document.querySelector("input[name='platform']:checked")?.value||"psn";

// Snip
snipBtn.addEventListener('click',doSnip);

// Auto refresh
document.getElementById('autoRefreshToggle').addEventListener('click',()=>{
  setAR(!arOn);
  localStorage.setItem('bf6-ar',arOn?'1':'0');
});
if(localStorage.getItem('bf6-ar')==='1') setAR(true);

// Form
formEl.addEventListener('submit',e=>{ e.preventDefault(); loadStats(); });

// Keyboard
document.addEventListener('keydown',e=>{
  if(e.target===tagEl) return;
  if(e.key==='r'||e.key==='R'){ e.preventDefault(); loadStats(); }
});
tagEl.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); loadStats(); } });

// URL params
const params=new URLSearchParams(location.search);
tagEl.value=params.get('tag')||'teamjmod';
const initPlat=document.getElementById(params.get('platform')||'psn')||document.getElementById('psn');
if(initPlat) initPlat.checked=true;

// Sync URL live
document.querySelectorAll("input[name='platform']").forEach(r=>{
  r.addEventListener('change',()=>{
    const u=new URL(location.href);
    u.searchParams.set('platform',r.value);
    u.searchParams.set('tag',tagEl.value);
    history.replaceState(null,'',u.toString());
  });
});
tagEl.addEventListener('input',()=>{
  const u=new URL(location.href);
  u.searchParams.set('tag',tagEl.value);
  history.replaceState(null,'',u.toString());
});

lastLoadTime=Date.now();
loadStats();
</script>
