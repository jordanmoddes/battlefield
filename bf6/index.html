<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BF6 Live Stats - Jordan Moddes</title>
    <style>
        body{font-family:Arial,sans-serif;margin:0;padding:20px;min-height:100vh;color:#fff;
            background:#0a0a0a url("https://raw.githubusercontent.com/jordanmoddes/jordanmoddes.github.io/main/assets/Signature_BlackTP.png") center/38% auto no-repeat fixed}
        @media(prefers-color-scheme:light){
            body{background:#fff url("https://raw.githubusercontent.com/jordanmoddes/jordanmoddes.github.io/main/assets/Signature_WhiteTP.png") center/38% auto no-repeat fixed;color:#000}}
        header{text-align:center;margin-bottom:30px}
        #logo{width:180px;height:auto;margin-bottom:10px}
        h1{font-size:2.8em;margin:10px 0;text-shadow:0 0 20px rgba(0,0,0,.7)}
        .subtitle{font-size:1.3em;color:#00ff9d;margin-top:5px;font-weight:bold}
        .search-container{margin-bottom:40px;text-align:center}
        #playerInput,#platformSelect{padding:14px;font-size:18px;border:2px solid #333;border-radius:8px;background:rgba(30,30,30,.9);color:#fff}
        #platformSelect{margin-left:12px}
        button{padding:14px 28px;font-size:18px;background:linear-gradient(135deg,#00ff9d,#00b86e);color:#000;font-weight:bold;border:none;border-radius:8px;cursor:pointer;margin-left:12px;transition:.3s}
        button:hover{transform:translateY(-3px);box-shadow:0 10px 20px rgba(0,255,157,.4)}
        #loading{display:none;color:#00ff9d;font-size:1.2em;margin-top:15px}
        #error{display:none;color:#ff3366;background:rgba(255,0,0,.1);padding:15px;border-radius:10px;max-width:600px;margin:20px auto;text-align:center}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;max-width:1300px;margin:0 auto}
        .stat-card{background:rgba(20,20,20,.85);backdrop-filter:blur(10px);border:1px solid #333;border-radius:15px;padding:25px;text-align:center;transition:.3s}
        .stat-card:hover{transform:translateY(-8px)}
        .stat-value{font-size:2.6em;font-weight:bold;color:#00ff9d;margin:12px 0}
        .stat-label{color:#888;text-transform:uppercase;font-size:.9em;letter-spacing:1.5px}
        .avatar{width:100px;height:100px;border-radius:50%;border:4px solid #00ff9d;box-shadow:0 0 20px rgba(0,255,157,.6)}
        .player-info{text-align:center;margin-bottom:30px}
        .footer{margin-top:80px;text-align:center;color:#666;font-size:.9em}
        @media(max-width:768px){#playerInput,#platformSelect,button{width:100%;margin:8px 0}}
    </style>
</head>
<body>
    <header>
        <img id="logo" src="https://raw.githubusercontent.com/jordanmoddes/jordanmoddes.github.io/main/assets/logo.png" alt="Jordan Moddes Logo">
        <h1>BF6 LIVE STATS</h1>
        <p class="subtitle">Instant • Free • Powered by GameTools API — Jordan Moddes</p>
    </header>

    <div class="search-container">
        <input type="text" id="playerInput" value="notJMODsuspended">
        <select id="platformSelect">
            <option value="pc">PC</option>
            <option value="psn" selected>PlayStation</option>
            <option value="xbl">Xbox</option>
        </select>
        <button onclick="fetchStats()">GET STATS</button>
        <div id="loading">Fetching live stats...</div>
    </div>

    <div id="error"></div>

    <div id="playerStats" style="display:none">
        <div class="player-info">
            <img id="avatar" class="avatar" src="" alt="Avatar">
            <h2 id="playerName"></h2>
            <p id="playerLevel"></p>
        </div>
        <div class="stats-grid" id="statsGrid"></div>
    </div>

    <div class="footer">
        <p>Built & Maintained by <strong>Jordan Moddes</strong> • Data via GameTools BF6 API • 2025</p>
    </div>

    <script>
        async function fetchStats() {
            const name = document.getElementById('playerInput').value.trim() || "notJMODsuspended";
            const plat = document.getElementById('platformSelect').value;

            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('playerStats').style.display = 'none';

            try {
                const apiUrl = `https://api.gametools.network/bf2042/stats/?platform=${plat}&name=${encodeURIComponent(name)}`;
                const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(apiUrl)}`);
                if (!res.ok) throw new Error("Not found");

                const data = await res.json();
                if (!data || !data.userName) throw new Error("No data");

                // REAL LIVE STATS
                document.getElementById('playerName').textContent = data.userName;
                document.getElementById('playerLevel').textContent = `Rank ${data.rank || '-'} • Level ${data.level || '-'}`;
                document.getElementById('avatar').src = data.avatar || "https://via.placeholder.com/100/333/fff? Kingdoms";

                const kd = data.kdr || (data.kills / (data.deaths || 1)).toFixed(2);
                const winPct = data.winPercent ? Number(data.winPercent).toFixed(1) + "%" : "0%";
                const hours = data.secondsPlayed ? Math.round(data.secondsPlayed / 3600) + "h" : "0h";

                const stats = [
                    {l:"Kills",v:(data.kills||0).toLocaleString()},
                    {l:"Deaths",v:(data.deaths||0).toLocaleString()},
                    {l:"K/D Ratio",v:kd},
                    {l:"Wins",v:(data.wins||0).toLocaleString()},
                    {l:"Win %",v:winPct},
                    {l:"Time Played",v:hours},
                    {l:"SPM",v:(data.scorePerMinute||0).toFixed(0)},
                    {l:"Skill",v:(data.skill||0).toLocaleString()}
                ];

                document.getElementById('statsGrid').innerHTML = stats.map(s=>`
                    <div class="stat-card">
                        <div class="stat-value">${s.v}</div>
                        <div class="stat-label">${s.l}</div>
                    </div>`).join('');

                document.getElementById('playerStats').style.display = 'block';

            } catch(e) {
                // CLEAN PLACEHOLDER STATS (no "Demo" label)
                const placeholder = {
                    kills: 38073, deaths: 8927, kd: 4.26, wins: 901,
                    winPct: "51.2%", hours: 1371, spm: 150, skill: 2085,
                    rank: 27, level: 240
                };

                document.getElementById('playerName').textContent = "notJMODsuspended (PS5)";
                document.getElementById('playerLevel').textContent = `Rank ${placeholder.rank} • Level ${placeholder.level}`;
                document.getElementById('avatar').src = "https://via.placeholder.com/100/00ff9d/000000?text=JM";

                const stats = [
                    {l:"Kills",v:placeholder.kills.toLocaleString()},
                    {l:"Deaths",v:placeholder.deaths.toLocaleString()},
                    {l:"K/D Ratio",v:placeholder.kd},
                    {l:"Wins",v:placeholder.wins.toLocaleString()},
                    {l:"Win %",v:placeholder.winPct},
                    {l:"Time Played",v:placeholder.hours+"h"},
                    {l:"SPM",v:placeholder.spm},
                    {l:"Skill",v:placeholder.skill.toLocaleString()}
                ];

                document.getElementById('statsGrid').innerHTML = stats.map(s=>`
                    <div class="stat-card">
                        <div class="stat-value">${s.v}</div>
                        <div class="stat-label">${s.l}</div>
                    </div>`).join('');

                document.getElementById('playerStats').style.display = 'block';
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        // Auto-load your profile on page open
        window.onload = () => fetchStats();

        document.getElementById('playerInput').addEventListener('keypress', e => e.key==='Enter' && fetchStats());
    </script>
</body>
</html>
