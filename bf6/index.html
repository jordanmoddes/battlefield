<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220">
  <title>Jmod's BF6 Stats</title>
  <link rel="icon" type="image/png" href="/assets/Signature_WhiteTP.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    :root {
      --bf-accent: #ff6a00;
      --bf-accent2: #ff8c00;
      --bg-overlay: rgba(8,14,26,.92);
      --card-bg: rgba(255,255,255,.07);
      --card-bg-hover: rgba(255,255,255,.11);
      --card-border: rgba(255,255,255,.13);
      --card-border-hover: rgba(255,106,0,.4);
      --text: #f0f4ff;
      --sub: #8fa3c0;
      --title: #60a5fa;
      --nav-bg: rgba(6,10,20,.88);
      --glow: rgba(255,106,0,0.15);
    }
    body.light {
      --bg-overlay: rgba(230,238,255,.92);
      --card-bg: rgba(0,0,0,.04);
      --card-bg-hover: rgba(0,0,0,.07);
      --card-border: rgba(15,23,42,.15);
      --card-border-hover: rgba(255,106,0,.5);
      --text: #0b1220;
      --sub: #4b5e78;
      --title: #1d4ed8;
      --nav-bg: rgba(230,238,255,.92);
      --glow: rgba(255,106,0,0.08);
    }

    * { box-sizing: border-box; }

    body {
      position: relative;
      min-height: 100vh;
      color: var(--text);
      background:
        linear-gradient(180deg, var(--bg-overlay), var(--bg-overlay)),
        url("https://assetsio.gnwcdn.com/battlefield-6-2.jpg?width=690&quality=85&format=jpg&dpr=3&auto=webp")
          center/cover no-repeat fixed;
      font-family: 'Barlow', system-ui, sans-serif;
      transition: background-color .25s, color .25s;
    }

    /* Watermark */
    .jm-watermark {
      position: fixed;
      inset: 0;
      background: url("/assets/Signature_BlackTP.png") center/38% auto no-repeat;
      opacity: 0.04;
      pointer-events: none;
      z-index: 0;
    }
    .page-shell { position: relative; z-index: 1; }

    /* â”€â”€â”€ TYPOGRAPHY â”€â”€â”€ */
    .font-display { font-family: 'Bebas Neue', sans-serif; letter-spacing: .06em; }
    .font-condensed { font-family: 'Barlow Condensed', sans-serif; }

    /* â”€â”€â”€ NAV â”€â”€â”€ */
    .nav {
      backdrop-filter: blur(12px);
      background: var(--nav-bg);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .nav .brand {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      letter-spacing: .12em;
      color: var(--bf-accent);
      text-decoration: none;
      transition: opacity .15s;
    }
    .nav .brand:hover { opacity: .8; }
    .icon-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: .45rem .85rem;
      border-radius: .5rem;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: .8rem;
      letter-spacing: .06em;
      color: var(--text);
      cursor: pointer;
      transition: all .15s;
      text-transform: uppercase;
    }
    .icon-btn:hover {
      border-color: var(--bf-accent);
      color: var(--bf-accent);
    }

    /* â”€â”€â”€ CARDS â”€â”€â”€ */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      transition: border-color .2s, background .2s;
    }
    .card:hover { border-color: var(--card-border-hover); }
    .card-tight { padding: 12px 14px; }

    /* â”€â”€â”€ SECTION TITLE â”€â”€â”€ */
    .sect-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .18em;
      color: var(--bf-accent);
      margin-bottom: .75rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .sect-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--card-border), transparent);
    }

    /* â”€â”€â”€ STAT ATOMS â”€â”€â”€ */
    .stat-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: .68rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--sub);
    }
    .stat-value {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 1.15rem;
      line-height: 1.1;
    }
    .stat-sub {
      font-size: .68rem;
      color: var(--sub);
      margin-top: .1rem;
    }

    /* â”€â”€â”€ GRID â”€â”€â”€ */
    .grid-auto {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
    }

    /* â”€â”€â”€ RADIO â”€â”€â”€ */
    .radio {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid var(--card-border);
      border-radius: 50%;
      position: relative;
      cursor: pointer;
      transition: border-color .15s;
    }
    .radio:checked { border-color: var(--bf-accent); }
    .radio:checked::after {
      content: '';
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      background: var(--bf-accent);
    }
    .chip {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: .35rem .65rem;
      border-radius: .5rem;
      font-size: .78rem;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 600;
      letter-spacing: .04em;
      cursor: pointer;
      transition: border-color .15s;
    }
    .chip:has(.radio:checked) { border-color: var(--bf-accent); }

    /* â”€â”€â”€ SUBMIT BTN â”€â”€â”€ */
    .btn-load {
      background: var(--bf-accent);
      color: #0b0f1a;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: .1em;
      padding: .65rem 1.6rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    .btn-load:hover { opacity: .88; transform: translateY(-1px); }
    .btn-load:active { transform: translateY(0); }

    /* â”€â”€â”€ RANK HERO â”€â”€â”€ */
    .rank-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .5rem;
      position: relative;
    }
    .rank-icon-wrap {
      position: relative;
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .rank-icon-wrap::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,106,0,.25) 0%, transparent 70%);
      animation: rankPulse 3s ease-in-out infinite;
    }
    @keyframes rankPulse {
      0%, 100% { opacity: .6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    .rank-icon {
      width: 100px;
      height: 100px;
      object-fit: contain;
      filter: drop-shadow(0 4px 16px rgba(255,106,0,0.45));
      position: relative;
      z-index: 1;
      animation: rankFloat 4s ease-in-out infinite;
    }
    @keyframes rankFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* â”€â”€â”€ XP PROGRESS BAR â”€â”€â”€ */
    .xp-bar-wrap {
      width: 100%;
      max-width: 260px;
    }
    .xp-bar-track {
      height: 4px;
      background: var(--card-border);
      border-radius: 99px;
      overflow: hidden;
      margin-top: .2rem;
    }
    .xp-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--bf-accent), var(--bf-accent2));
      border-radius: 99px;
      transition: width 1.2s cubic-bezier(.4,0,.2,1);
      width: 0;
    }

    /* â”€â”€â”€ IN-MATCH BADGE â”€â”€â”€ */
    .in-match-badge {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      background: rgba(255,40,40,.15);
      border: 1px solid rgba(255,40,40,.4);
      color: #ff6060;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: .68rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: .2rem .55rem;
      border-radius: 4px;
    }
    .in-match-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ff4040;
      animation: liveDot 1.2s ease-in-out infinite;
    }
    @keyframes liveDot {
      0%, 100% { opacity: 1; }
      50% { opacity: .2; }
    }

    /* â”€â”€â”€ K/D GAUGE â”€â”€â”€ */
    .kd-gauge-wrap { display: flex; flex-direction: column; align-items: center; gap: .3rem; }
    .kd-arc {
      width: 80px;
      height: 44px;
      position: relative;
      overflow: hidden;
    }
    .kd-arc svg { width: 100%; height: 100%; overflow: visible; }

    /* â”€â”€â”€ WIN BAR â”€â”€â”€ */
    .win-bar {
      height: 6px;
      border-radius: 99px;
      overflow: hidden;
      background: rgba(255,255,255,.08);
      position: relative;
    }
    .win-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #16a34a);
      border-radius: 99px;
      transition: width 1s ease;
      width: 0;
    }

    /* â”€â”€â”€ DELTA INDICATORS â”€â”€â”€ */
    .delta-up { color: #4ade80; font-size: .65rem; font-weight: 700; }
    .delta-down { color: #f87171; font-size: .65rem; font-weight: 700; }

    /* â”€â”€â”€ WEAPON / VEHICLE HERO CARD â”€â”€â”€ */
    .hero-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .hero-item-img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      flex-shrink: 0;
    }
    .hero-item-img-lg {
      width: 80px;
      height: 56px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      flex-shrink: 0;
    }

    /* â”€â”€â”€ CLASS BAR â”€â”€â”€ */
    .class-bars { display: flex; gap: 3px; height: 8px; border-radius: 4px; overflow: hidden; }
    .class-bar-seg { height: 100%; transition: width 1s ease; min-width: 0; }

    /* â”€â”€â”€ REFRESH TIMER â”€â”€â”€ */
    .refresh-timer {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: .72rem;
      letter-spacing: .06em;
      color: var(--sub);
    }

    /* â”€â”€â”€ AUTO REFRESH TOGGLE â”€â”€â”€ */
    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: .4rem;
      cursor: pointer;
    }
    .toggle-track {
      width: 32px;
      height: 17px;
      background: var(--card-border);
      border-radius: 99px;
      position: relative;
      transition: background .2s;
    }
    .toggle-track.on { background: var(--bf-accent); }
    .toggle-thumb {
      width: 13px;
      height: 13px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: transform .2s;
    }
    .toggle-track.on .toggle-thumb { transform: translateX(15px); }

    /* â”€â”€â”€ JSON â”€â”€â”€ */
    .json-output {
      font-family: ui-monospace, 'Cascadia Code', monospace;
      font-size: .72rem;
      white-space: pre-wrap;
      max-height: 380px;
      overflow: auto;
      line-height: 1.5;
    }

    /* â”€â”€â”€ REVEAL ANIMATIONS â”€â”€â”€ */
    .reveal {
      opacity: 0;
      transform: translateY(14px);
      animation: revealUp .4s ease forwards;
    }
    @keyframes revealUp {
      to { opacity: 1; transform: translateY(0); }
    }
    .reveal-d1 { animation-delay: .05s; }
    .reveal-d2 { animation-delay: .10s; }
    .reveal-d3 { animation-delay: .15s; }
    .reveal-d4 { animation-delay: .20s; }
    .reveal-d5 { animation-delay: .25s; }
    .reveal-d6 { animation-delay: .30s; }
    .reveal-d7 { animation-delay: .35s; }
    .reveal-d8 { animation-delay: .40s; }
    .reveal-d9 { animation-delay: .45s; }

    /* â”€â”€â”€ SKELETON â”€â”€â”€ */
    .skeleton {
      background: linear-gradient(90deg, var(--card-bg) 25%, var(--card-bg-hover) 50%, var(--card-bg) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* â”€â”€â”€ FLAVOR QUOTE â”€â”€â”€ */
    .flavor-quote {
      font-family: 'Bebas Neue', sans-serif;
      font-size: .9rem;
      letter-spacing: .18em;
      color: var(--sub);
      text-align: center;
      opacity: .6;
      margin-top: .15rem;
    }

    /* â”€â”€â”€ PERSONAL BEST â”€â”€â”€ */
    .pb-tag {
      display: inline-block;
      background: rgba(255,106,0,.15);
      border: 1px solid rgba(255,106,0,.35);
      color: var(--bf-accent);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: .6rem;
      font-weight: 700;
      letter-spacing: .1em;
      padding: .05rem .3rem;
      border-radius: 3px;
      vertical-align: middle;
      margin-left: .3rem;
    }

    /* â”€â”€â”€ PLATFORM ICON â”€â”€â”€ */
    .platform-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--bf-accent);
      display: inline-block;
      margin-right: 4px;
    }

    /* â”€â”€â”€ RETRY STATE â”€â”€â”€ */
    .retry-countdown {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: .8rem;
      color: var(--sub);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--bf-accent); }

    /* tag input */
    #tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      border-radius: 6px;
      padding: .6rem .75rem;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: .95rem;
      font-weight: 600;
      letter-spacing: .04em;
      outline: none;
      transition: border-color .15s;
    }
    #tag:focus { border-color: var(--bf-accent); }
  </style>
</head>

<div class="page-shell">

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   RANK ICON LOGIC â€” bf6ranks.com
   Available milestones: 1â€“50 (every 1), 55â€“100 (every 5),
   110â€“500 (every 10), 1000â€“5000 (every 500)
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
function getRankImageUrl(rankNum) {
  const r = Math.max(1, Math.floor(Number(rankNum) || 1));
  let tier;
  if (r <= 50) {
    tier = r;
  } else if (r <= 100) {
    tier = Math.floor(r / 5) * 5;
    if (tier < 55) tier = 55;
  } else if (r <= 500) {
    tier = Math.floor(r / 10) * 10;
    if (tier < 110) tier = 110;
  } else if (r <= 5000) {
    tier = Math.floor(r / 500) * 500;
    if (tier < 1000) tier = 1000;
  } else {
    tier = 5000;
  }
  return `https://bf6ranks.com/ranks/${tier}.png`;
}

/* XP â†’ rank (approximate community formula) */
function xpToRank(xp) {
  if (!xp) return null;
  const x = Number(xp);
  // Early ranks: 10k XP each; scales up. Community approximation.
  if (x < 500000)  return Math.max(1, Math.floor(x / 10000) + 1);
  if (x < 2000000) return Math.floor(50 + (x - 500000) / 20000);
  if (x < 8000000) return Math.floor(125 + (x - 2000000) / 40000);
  return Math.floor(275 + (x - 8000000) / 80000);
}

/* XP needed for next rank milestone */
function xpForRank(r) {
  if (r <= 50)  return r * 10000;
  if (r <= 125) return 500000 + (r - 50) * 20000;
  if (r <= 275) return 2000000 + (r - 125) * 40000;
  return 8000000 + (r - 275) * 80000;
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   FORMAT HELPERS
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
function fmtNum(x) {
  if (x == null || isNaN(x)) return "â€”";
  return Number(x).toLocaleString();
}
function fmtFloat(x, d = 2) {
  if (x == null || isNaN(x)) return "â€”";
  return Number(x).toFixed(d);
}
function fmtSeconds(sec) {
  if (!sec && sec !== 0) return "â€”";
  const s = Number(sec);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  if (h === 0 && m === 0) return s + "s";
  return h ? `${h}h ${m}m` : `${m}m`;
}
function kmFromUnits(x) {
  if (!x && x !== 0) return "â€”";
  return (Number(x) / 1000).toFixed(1) + " km";
}
function fmtPct(x) {
  if (x == null) return "â€”";
  return String(x);
}
function pctNum(wins, matches) {
  const m = Number(matches || 0);
  const w = Number(wins || 0);
  return m ? (w / m) * 100 : 0;
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   DELTA (vs previous load)
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
function getDelta(key, current, prev) {
  if (!prev) return "";
  const d = Number(current) - Number(prev[key] || 0);
  if (d === 0 || isNaN(d)) return "";
  const sign = d > 0 ? "+" : "";
  const cls = d > 0 ? "delta-up" : "delta-down";
  return `<span class="${cls}">${sign}${Number(d).toLocaleString()}</span>`;
}
function deltaFloat(key, current, prev, digits = 2) {
  if (!prev) return "";
  const d = Number(current) - Number(prev[key] || 0);
  if (Math.abs(d) < 0.001 || isNaN(d)) return "";
  const sign = d > 0 ? "+" : "";
  const cls = d > 0 ? "delta-up" : "delta-down";
  return `<span class="${cls}">${sign}${d.toFixed(digits)}</span>`;
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   PERSONAL BEST CHECK
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
function checkPB(key, val) {
  const v = Number(val);
  if (isNaN(v)) return false;
  if (!PERSONAL_BESTS[key] || v > PERSONAL_BESTS[key]) {
    PERSONAL_BESTS[key] = v;
    localStorage.setItem(PB_KEY, JSON.stringify(PERSONAL_BESTS));
    return true;
  }
  return false;
}
function pbTag(key, val) {
  return checkPB(key, val) ? '<span class="pb-tag">PB ðŸ”¥</span>' : '';
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   MAP HELPERS
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
function isRedSec(m) {
  return String(m?.mapName ?? "").trim().toUpperCase().includes("REDSEC");
}
function sumMapRows(rows) {
  return rows.reduce((a, m) => {
    a.matches += Number(m?.matches || 0);
    a.wins    += Number(m?.wins || 0);
    a.losses  += Number(m?.losses || 0);
    return a;
  }, { matches: 0, wins: 0, losses: 0 });
}
function computeRedSecSplit(maps) {
  const list = Array.isArray(maps) ? maps : [];
  const red = sumMapRows(list.filter(isRedSec));
  const non = sumMapRows(list.filter(m => !isRedSec(m)));
  return {
    red: { ...red, winPct: pctNum(red.wins, red.matches) },
    non: { ...non, winPct: pctNum(non.wins, non.matches) }
  };
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   KD GAUGE SVG
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
function kdGaugeSVG(kd) {
  const val = Math.min(Math.max(Number(kd) || 0, 0), 4);
  const pct = val / 4;
  const angle = pct * 180;
  const r = 36;
  const cx = 40, cy = 40;
  const startX = cx - r, startY = cy;
  const rad = (angle - 180) * Math.PI / 180;
  const endX = cx + r * Math.cos(rad);
  const endY = cy + r * Math.sin(rad);
  const large = angle > 180 ? 1 : 0;
  const color = val >= 2 ? "#4ade80" : val >= 1 ? "#facc15" : "#f87171";
  return `
    <svg viewBox="0 0 80 44" xmlns="http://www.w3.org/2000/svg">
      <path d="M ${cx-r},${cy} A ${r},${r} 0 0,1 ${cx+r},${cy}"
            fill="none" stroke="rgba(255,255,255,.1)" stroke-width="5" stroke-linecap="round"/>
      <path d="M ${startX},${startY} A ${r},${r} 0 ${large},1 ${endX},${endY}"
            fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round"
            style="filter:drop-shadow(0 0 4px ${color})"/>
      <text x="${cx}" y="${cy-2}" text-anchor="middle"
            font-family="Barlow Condensed,sans-serif" font-weight="700" font-size="13"
            fill="${color}">${fmtFloat(kd, 2)}</text>
      <text x="${cx-r+2}" y="${cy+12}" text-anchor="middle"
            font-family="Barlow Condensed,sans-serif" font-size="7" fill="rgba(255,255,255,.35)">0</text>
      <text x="${cx+r-2}" y="${cy+12}" text-anchor="middle"
            font-family="Barlow Condensed,sans-serif" font-size="7" fill="rgba(255,255,255,.35)">4</text>
    </svg>`;
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   API LOAD
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
let retryTimer = null;

async function loadStats() {
  const platform = document.querySelector("input[name='platform']:checked")?.value || "psn";
  const tag      = (tagEl.value || "").trim() || "teamjmod";
  const url      = `${API_BASE}?${new URLSearchParams({ name: tag, platform, lang: "en-us" })}`;

  if (retryTimer) { clearInterval(retryTimer); retryTimer = null; }

  statusEl.textContent = "Loadingâ€¦";
  renderSkeleton();
  jsonEl.textContent = "Fetchingâ€¦";

  try {
    const res  = await fetch(url, { cache: "no-store" });
    const raw  = await res.text();
    let data;
    try { data = JSON.parse(raw); } catch { data = raw; }

    if (!res.ok || typeof data === "string") {
      throw new Error(typeof data === "string" ? data : JSON.stringify(data, null, 2));
    }

    jsonEl.textContent    = JSON.stringify(data, null, 2);
    updatedEl.textContent = new Date().toLocaleTimeString();
    statusEl.textContent  = "OK";
    lastLoadTime = Date.now();
    startRefreshTimer();
    renderDashboard(data, platform);

  } catch (err) {
    console.error(err);
    statusEl.textContent = "Error";
    jsonEl.textContent   = "Error:\n\n" + (err.message || String(err));

    let countdown = 30;
    contentEl.innerHTML = `
      <div class="card text-center reveal reveal-d1">
        <div class="font-display text-2xl mb-2" style="color:var(--bf-accent)">Load Failed</div>
        <div class="stat-sub mb-3">Could not load stats for <b>${(tagEl.value||"").trim()||"â€”"}</b> on ${(document.querySelector("input[name='platform']:checked")?.value||"psn").toUpperCase()}</div>
        <div class="retry-countdown" id="retryCountdown">Retrying in ${countdown}sâ€¦</div>
      </div>`;

    retryTimer = setInterval(() => {
      countdown--;
      const el = document.getElementById("retryCountdown");
      if (el) el.textContent = `Retrying in ${countdown}sâ€¦`;
      if (countdown <= 0) {
        clearInterval(retryTimer);
        retryTimer = null;
        loadStats();
      }
    }, 1000);
  }
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   REFRESH COUNTDOWN TIMER
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
let lastLoadTime = 0;
let timerInterval = null;
let autoRefreshInterval = null;
let autoRefreshEnabled = false;

function startRefreshTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    const sec = Math.floor((Date.now() - lastLoadTime) / 1000);
    if (sec < 60) {
      timerEl.textContent = `${sec}s ago`;
    } else {
      const m = Math.floor(sec / 60);
      timerEl.textContent = `${m}m ago`;
    }
  }, 1000);
}

function setAutoRefresh(on) {
  autoRefreshEnabled = on;
  const track = document.getElementById("toggleTrack");
  track.classList.toggle("on", on);
  if (autoRefreshInterval) clearInterval(autoRefreshInterval);
  if (on) {
    autoRefreshInterval = setInterval(loadStats, 5 * 60 * 1000);
  }
}

  const light = document.body.classList.contains("light");
  themeBtn.textContent = light ? "Dark" : "Light";
  localStorage.setItem("bf6-theme", light ? "light" : "dark");
});

// Share
shareBtn.addEventListener("click", async () => {
  const platform = document.querySelector("input[name='platform']:checked")?.value || "psn";
  const tag = (tagEl.value || "").trim();
  const url = `${location.origin}${location.pathname}?tag=${encodeURIComponent(tag)}&platform=${platform}`;
  try {
    await navigator.clipboard.writeText(url);
    const t = shareBtn.textContent;
    shareBtn.textContent = "Copied!";
    setTimeout(() => shareBtn.textContent = t, 1400);
  } catch {
    alert("Copy from address bar manually.");
  }
});

// Snip
snipBtn.addEventListener("click", async () => {
  const wasLight = document.body.classList.contains("light");
  if (wasLight) document.body.classList.remove("light");
  try {
    const target = document.getElementById("snip-root");
    const canvas = await html2canvas(target, {
      useCORS: true,
      backgroundColor: null,
      scrollX: 0,
      scrollY: -window.scrollY,
      windowWidth: target.scrollWidth,
      windowHeight: target.scrollHeight,
      scale: 2,
      logging: false
    });
    canvas.toBlob(async (blob) => {
      if (!blob) return alert("Failed.");
      try {
        await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
        const t = snipBtn.textContent;
        snipBtn.textContent = "Snipped!";
        setTimeout(() => snipBtn.textContent = t, 1400);
      } catch {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "bf6-stats.png";
        a.click();
      }
    });
  } catch(err) {
    console.error(err);
    alert("Screenshot failed.");
  } finally {
    if (wasLight) document.body.classList.add("light");
  }
});

// Auto refresh toggle
document.getElementById("autoRefreshToggle").addEventListener("click", () => {
  setAutoRefresh(!autoRefreshEnabled);
  localStorage.setItem("bf6-autorefresh", autoRefreshEnabled ? "1" : "0");
});
if (localStorage.getItem("bf6-autorefresh") === "1") setAutoRefresh(true);

// Form submit
formEl.addEventListener("submit", (e) => { e.preventDefault(); loadStats(); });

// Keyboard shortcuts
document.addEventListener("keydown", (e) => {
  if (e.target === tagEl) return;
  if (e.key === "r" || e.key === "R") { e.preventDefault(); loadStats(); }
});
tagEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); loadStats(); }
});

// URL params
const params = new URLSearchParams(location.search);
const defaultTag = params.get("tag") || "teamjmod";
const defaultPlatform = params.get("platform") || "psn";
tagEl.value = defaultTag;
const initialRadio = document.getElementById(defaultPlatform) || document.getElementById("psn");
if (initialRadio) initialRadio.checked = true;

// Sync URL on platform change
document.querySelectorAll("input[name='platform']").forEach(r => {
  r.addEventListener("change", () => {
    const url = new URL(location.href);
    url.searchParams.set("platform", r.value);
    url.searchParams.set("tag", tagEl.value);
    history.replaceState(null, "", url.toString());
  });
});
tagEl.addEventListener("input", () => {
  const url = new URL(location.href);
  url.searchParams.set("tag", tagEl.value);
  history.replaceState(null, "", url.toString());
});

// Initial load
lastLoadTime = Date.now();
loadStats();
</script>
</body>
</html>
