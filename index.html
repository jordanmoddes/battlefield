<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Battlefield Stats Dashboard</title>

<link rel="icon" type="image/png" href="/jmodco/assets/Signature_WhiteTP.png" />

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  min-height: 100vh;
  background:
    linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,.55)),
    url("https://assetsio.gnwcdn.com/battlefield-6-2.jpg?width=690&quality=85&format=jpg&dpr=3&auto=webp") center/cover no-repeat fixed;
  font-family: system-ui, sans-serif;
  color: white;
}
.card {
  background: rgba(0,0,0,.45);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 12px;
  padding: 16px;
}
.error {
  background: #7f1d1d;
  border: 1px solid #fecaca;
  padding: 12px;
  border-radius: 10px;
  margin-top: 10px;
}
</style>
</head>

<body class="pb-20">

<!-- HEADER -->
<div class="text-center pt-6 pb-2 text-3xl font-extrabold">
  Battlefield Stats Dashboard
</div>
<div class="text-center text-sm opacity-70 mb-6">Free API via GameTools.network</div>

<!-- CONTROLS -->
<div class="max-w-3xl mx-auto card mb-4">

  <!-- GAME SELECT -->
  <label class="text-sm opacity-80">Game</label>
  <select id="game" class="w-full mt-1 mb-3 px-3 py-2 rounded-md text-black">
    <option value="bf6">Battlefield 6</option>
    <option value="bf2042">Battlefield 2042</option>
    <option value="bfv">Battlefield V</option>
    <option value="bf1">Battlefield 1</option>
    <option value="bf4">Battlefield 4</option>
  </select>

  <!-- PLATFORM SELECT (changes based on game) -->
  <label class="text-sm opacity-80">Platform</label>
  <div id="platforms" class="flex gap-3 mt-1 mb-4 text-sm"></div>

  <!-- PLAYER ID -->
  <label class="text-sm opacity-80">EA / Origin ID</label>
  <input id="pid" class="w-full mt-1 px-3 py-2 rounded-md text-black"
         placeholder="Enter EA ID (e.g. notJMODsuspended)" />

  <!-- LOAD BUTTON -->
  <button id="loadBtn"
    class="mt-4 w-full py-3 bg-orange-500 hover:bg-orange-600 font-bold rounded-lg">
    LOAD
  </button>

  <!-- Last updated -->
  <div class="mt-3 text-right text-xs opacity-70">
    Last updated: <span id="updated">—</span>
  </div>
</div>

<!-- ERROR -->
<div id="error" class="max-w-3xl mx-auto"></div>

<!-- RESULTS -->
<div id="results" class="max-w-3xl mx-auto space-y-4 text-sm"></div>

<script>
/* -----------------------------------------
   PLATFORM MAPS BY GAME
------------------------------------------ */
const GAME_PLATFORMS = {
  bf6: ["ea", "steam"],            // BF6 = EA or Steam
  bf2042: ["pc", "psn", "xbl"],    // 2042 API needs personaId, but GameTools "pc/psn/xbl"
  bfv: ["pc", "psn", "xbl"],
  bf1: ["pc", "psn", "xbl"],
  bf4: ["pc", "psn", "xbl"]
};

/* -----------------------------------------
   RENDER PLATFORM BUTTONS
------------------------------------------ */
function renderPlatforms() {
  const game = document.getElementById("game").value;
  const platforms = GAME_PLATFORMS[game];
  const container = document.getElementById("platforms");

  container.innerHTML = "";

  platforms.forEach(p => {
    const label = p.toUpperCase();
    container.innerHTML += `
      <label class="flex items-center gap-2 cursor-pointer">
        <input type="radio" name="platform" value="${p}" />
        ${label}
      </label>
    `;
  });

  container.querySelector("input").checked = true;
}

renderPlatforms();

document.getElementById("game").addEventListener("change", renderPlatforms);

/* -----------------------------------------
   LOAD DATA
------------------------------------------ */
document.getElementById("loadBtn").addEventListener("click", async () => {
  const game = document.getElementById("game").value;
  const platform = document.querySelector("input[name='platform']:checked").value;
  const pid = document.getElementById("pid").value.trim();

  if (!pid) {
    showError("Please enter a Player ID.");
    return;
  }

  clearError();
  document.getElementById("results").innerHTML = "Loading...";

  const url = `https://api.gametools.network/${game}/stats/player/${platform}/${pid}?format=json`;

  try {
    const res = await fetch(url);
    const data = await res.json();

    if (res.status !== 200) {
      showError(`Error ${res.status}: ${data.error || "Unable to load stats."}`);
      document.getElementById("results").innerHTML = "";
      return;
    }

    document.getElementById("updated").textContent = new Date().toLocaleTimeString();

    renderStats(data);

  } catch (e) {
    showError("Failed to fetch data.");
  }
});

/* -----------------------------------------
   DISPLAY ERROR
------------------------------------------ */
function showError(msg) {
  document.getElementById("error").innerHTML =
    `<div class="error">${msg}</div>`;
}

function clearError() {
  document.getElementById("error").innerHTML = "";
}

/* -----------------------------------------
   RENDER RESULTS
------------------------------------------ */
function renderStats(data) {
  const r = document.getElementById("results");
  const p = data.player;

  r.innerHTML = `
    <div class="card">
      <div class="text-xl font-bold mb-2">Overview</div>
      <div>Kills: ${p.kills ?? "—"}</div>
      <div>Deaths: ${p.deaths ?? "—"}</div>
      <div>K/D: ${p.kd ?? "—"}</div>
      <div>Wins: ${p.wins ?? "—"}</div>
      <div>Time Played: ${p.timePlayed ?? "—"} hrs</div>
      <div>Headshots: ${p.headshotPercentage ?? "—"}%</div>
    </div>
  `;
}
</script>

</body>
</html>
