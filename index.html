<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000">

  <title>Battlefield 6 Dashboard</title>

  <!-- favicon -->
  <link rel="icon" type="image/png" href="/jmodco/assets/Signature_WhiteTP.png" />

  <!-- tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- snip -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    body{
      background:
        linear-gradient(0deg, rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
        url("https://i.imgur.com/0pNTRSm.jpeg") center/cover no-repeat fixed;
      color:white;
      font-family: Inter, system-ui, sans-serif;
      min-height:100vh;
    }

    .card{
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.18);
      border-radius:16px;
      padding:16px;
    }

    .title{
      font-size:1.3rem;
      font-weight:700;
      color:#ff6a00;
      margin-bottom:.5rem;
      text-align:center;
    }
  </style>
</head>

<body class="pb-10">

  <nav class="w-full py-3 px-5 flex justify-between items-center bg-black/40 backdrop-blur-md">
    <div class="font-extrabold tracking-wider text-lg">JMOD</div>
    <div class="flex gap-2">
      <button id="shareBtn" class="px-3 py-1 bg-white/20 rounded">Share</button>
      <button id="snipBtn" class="px-3 py-1 bg-white/20 rounded">Snip</button>
    </div>
  </nav>

  <header class="text-center mt-6 mb-4">
    <h1 class="text-3xl font-extrabold">Battlefield 6 Stats Dashboard</h1>
    <p class="opacity-80 text-sm">Free API via GameTools.network</p>
  </header>

  <!-- search controls -->
  <div class="max-w-4xl mx-auto card mb-6">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-3 items-end">
      
      <div>
        <label class="text-sm opacity-80">Platform</label>
        <select id="platform" class="w-full text-black px-2 py-2 rounded">
          <option value="pc">PC</option>
          <option value="psn">PSN</option>
          <option value="xbl">Xbox</option>
        </select>
      </div>

      <div class="md:col-span-2">
        <label class="text-sm opacity-80">EA / Origin ID</label>
        <input id="playerId" class="w-full text-black px-3 py-2 rounded" placeholder="Enter player ID" />
      </div>

      <button id="loadBtn" class="bg-orange-500 hover:bg-orange-600 text-black font-bold py-2 rounded">
        LOAD
      </button>
    </div>
    <div class="text-xs mt-2 opacity-70">Last updated: <span id="lastUpdate">—</span></div>
  </div>

  <main id="content" class="max-w-5xl mx-auto space-y-4"></main>

  <footer class="text-center text-xs mt-10 opacity-70">
    Powered by GameTools.network (Free API)
  </footer>

<script>
async function loadBF6() {
  const platform = document.getElementById("platform").value;
  const id = document.getElementById("playerId").value.trim();
  const out = document.getElementById("content");
  const last = document.getElementById("lastUpdate");

  if (!id) {
    out.innerHTML = `<div class="card">Enter a player ID.</div>`;
    return;
  }

  const url = `https://api.gametools.network/bf6/stats/player/${platform}/${id}?format=json`;

  try {
    out.innerHTML = `<div class="card">Loading...</div>`;

    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);

    const data = await r.json();

    const p = data.player || {};

    out.innerHTML = `
      <section class="card">
        <div class="title">Overview</div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-sm">
          <div><b>Kills:</b> ${p.kills ?? "—"}</div>
          <div><b>Deaths:</b> ${p.deaths ?? "—"}</div>
          <div><b>K/D:</b> ${p.kd ?? "—"}</div>
          <div><b>Wins:</b> ${p.wins ?? "—"}</div>
          <div><b>Time Played:</b> ${p.timePlayed ?? "—"} hrs</div>
          <div><b>Accuracy:</b> ${p.accuracy ?? "—"}%</div>
          <div><b>Headshot %:</b> ${p.headshotPercentage ?? "—"}%</div>
          <div><b>Shots Fired:</b> ${p.shotsFired ?? "—"}</div>
        </div>
      </section>
    `;

    last.textContent = new Date().toLocaleTimeString();

  } catch (err) {
    out.innerHTML = `
      <div class="card bg-red-900 border-red-400">
        <b>Error loading data.</b><br>
        ${err.message}
      </div>`;
  }
}

document.getElementById("loadBtn").addEventListener("click", loadBF6);

document.getElementById("shareBtn").addEventListener("click", () => {
  navigator.clipboard.writeText(location.href);
  alert("Link copied!");
});

document.getElementById("snipBtn").addEventListener("click", async () => {
  const canvas = await html2canvas(document.body);
  canvas.toBlob(blob => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "bf6_stats.png";
    a.click();
  });
});
</script>

</body>
</html>
